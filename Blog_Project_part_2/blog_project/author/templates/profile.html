{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}

<div>
    <a class="btn btn-primary" href="{% url 'edit_profile' %}">Edit Your Profile</a>
</div>
<div class="d-flex flex-wrap justify-content-center px-3">
    {% for p in post %}
    <div class="col-sm-3 mb-3 mb-sm-0">
        <div class="card mx-2">
            <div class="card-body">
                <h5 class="card-title">{{p.title}}</h5>
                <p class="card-text">{{p.content}}</p>
                <p>Author: {{p.author.first_name}} {{p.author.last_name}}</p>
                <p>Category:
                    {% for cat in p.category.all %}
                    <button class="btn btn-danger btn-sm m-1" disabled>{{cat.name}}</button>
                    {% endfor %}
                </p>
                <a href="{% url 'edit_post' p.id %}" class="btn btn-warning">Edit</a>
                <a href="{% url 'delete_post' p.id %}" class="btn btn-warning">Delete</a>
            </div>
        </div>
    </div>
    {% endfor %}


    {% endblock %}
