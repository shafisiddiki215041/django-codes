{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}

<form style="width: 50%; margin: auto;" method="post">
    {% csrf_token %}
    <h1>Profile page</h1>
    <a href="{% url 'pass_change' %}" class="btn btn-warning btn-sm ">Change Your Password here..</a>

    {{form | crispy}}
    <button class="mb-5 btn btn-warning" type="submit">Submit</button>
</form>
{% endblock %}
