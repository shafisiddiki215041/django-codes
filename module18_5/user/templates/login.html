{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}


<form style="width: 50%; margin: auto;" action="" method="post" novalidate>
    {% csrf_token %}
    <h1>Login Page</h1>

 {% if form.non_field_errors %}
    {% for er in form.non_field_errors %}
    <p class="bg-danger text-white p-3">{{er}}</p>
    {% endfor %}
    {% endif %}

    <!-- {{form | crispy}} -->
    {% for er in form %}
    {{er.label_tag}}
    {{er}}
    {{er.errors }}
   
    {% endfor %}
    <br>
    <button class="btn btn-secondary" type="submit">Submit</button>
</form>
{% endblock  %}
